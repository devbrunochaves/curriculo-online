name: Agente de Prospecção Diária

on:
  schedule:
    # Roda todos os dias às 08:00 horário de Brasília (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub (útil pra testar)

jobs:
  prospectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r scripts/prospeccao/requirements.txt

      - name: Executar agente de prospecção
        working-directory: scripts/prospeccao
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python agent.py
